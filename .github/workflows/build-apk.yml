name: Test and build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DocReader-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocReader-apk-${{ github.run_number }}
          path: out/*.apk

      # Кожна збірка публікується як реліз, щоб APK можна було завантажити прямо з телефона.
      # Збірки з PR позначаються як попередні (pre-release).
      - name: Publish release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: Читалка, збірка ${{ github.run_number }}
          prerelease: ${{ github.event_name == 'pull_request' }}
          make_latest: ${{ github.event_name != 'pull_request' }}
          body: |
            Завантажте файл DocReader-${{ github.run_number }}.apk нижче та відкрийте його на телефоні,
            щоб встановити (може знадобитися дозвіл «Встановлювати з невідомих джерел»).
          files: out/*.apk
