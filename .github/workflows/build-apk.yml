name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DocReader-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocReader-apk-${{ github.run_number }}
          path: out/*.apk

      # Після злиття в main створюється реліз, з якого APK зручно завантажити прямо на телефон
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Читалка, збірка ${{ github.run_number }}
          body: |
            Завантажте файл DocReader-${{ github.run_number }}.apk нижче та відкрийте його на телефоні,
            щоб встановити (може знадобитися дозвіл «Встановлювати з невідомих джерел»).
          files: out/*.apk
