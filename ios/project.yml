# Проєкт Xcode генерується з цього файлу: brew install xcodegen && xcodegen generate
name: DocReader
options:
  bundleIdPrefix: ua.docreader
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: uk
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DocReader:
    type: application
    platform: iOS
    sources:
      - path: DocReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.docreader.ios
        PRODUCT_NAME: DocReader
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: DocReader/Info.plist
    info:
      path: DocReader/Info.plist
      properties:
        CFBundleDisplayName: Читалка
        CFBundleDevelopmentRegion: uk
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # відкриття файлів з інших застосунків («Відкрити в…», «Поділитися», «Файли»)
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Word
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - public.rtf
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg, public.png, public.heic, public.image]
  DocReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DocReaderTests
    dependencies:
      - target: DocReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ua.docreader.ios.tests
schemes:
  DocReader:
    build:
      targets:
        DocReader: all
        DocReaderTests: [test]
    test:
      targets:
        - DocReaderTests
